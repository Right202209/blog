<!DOCTYPE html>
{% assign lang = page.lang | default: site.lang | default: 'zh' %}
{% assign t = site.data.i18n.languages[lang] | default: site.data.i18n.languages.zh %}
<html lang="{{ lang }}">
  {% include head.html %}
  <body id="top" class="layout-{{ page.layout | default: 'default' }}">
    <a class="skip-link" href="#main-content">{{ t.skip_content }}</a>
    <div class="site-background" aria-hidden="true"></div>
    <div class="site-shell">
      {% include nav.html %}
      <main id="main-content" class="main" tabindex="-1">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% include analytics.html %}
  </body>
</html>
