<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-cn' }}">
  {% include head.html %}
  <body class="layout-{{ page.layout | default: 'default' }}">
    {% include nav.html %}

    <div class="background">
      <div class="cover"></div>
    </div>

    <div class="main">
      {{ content }}

      <div class="find ch">
        <div class="container links">
          <div class="footer ch">
            <div class="container">
              {% include footer.html %}
            </div>
          </div>
        </div>
      </div>
    </div>

    {% include analytics.html %}

    <script>
      (function () {
        function randomBetween(min, max) {
          return min + Math.round(Math.random() * (max - min));
        }

        function pickSlogan() {
          var slogan = document.getElementById("slogan");
          if (!slogan) return;

          var lines = [
            "{{ site.description | escape }}",
            "把判断写下来，再让证据修正它。",
            "记录技术、方法，以及能长期复用的经验。",
            "在噪音很多的时候，尽量保留清晰的页面和思路。"
          ];

          slogan.textContent = lines[randomBetween(0, lines.length - 1)];
        }

        window.addEventListener("DOMContentLoaded", function () {
          pickSlogan();
        });
      })();
    </script>
  </body>
</html>
