    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
<script>
  (function () {
    if (!window.gsap || !window.ScrollTrigger) return;
    gsap.registerPlugin(ScrollTrigger);

    window.addEventListener("DOMContentLoaded", function () {
      gsap.matchMedia().add("(prefers-reduced-motion: no-preference)", function () {
        // 浮墨 background motes: soft fade-in, slow drift, scroll parallax
        gsap.utils.toArray(".paper-motes .mote").forEach(function (mote, i) {
          var inner = mote.firstElementChild;
          var depth = parseFloat(mote.dataset.depth) || 0.4;

          gsap.from(mote, { opacity: 0, duration: 1.4, delay: 0.2 + i * 0.15, ease: "power1.out" });

          // perpetual drift, like ink suspended in water
          gsap.to(inner, {
            x: gsap.utils.random(-28, 28),
            y: gsap.utils.random(-22, 22),
            rotation: gsap.utils.random(-3, 3),
            duration: gsap.utils.random(14, 22),
            ease: "sine.inOut",
            yoyo: true,
            repeat: -1
          });

          // depth parallax: nearer motes slide further as the page scrolls
          gsap.to(mote, {
            y: function () { return -window.innerHeight * depth * 0.5; },
            ease: "none",
            scrollTrigger: {
              trigger: document.documentElement,
              start: 0,
              end: "max",
              scrub: 1.2,
              invalidateOnRefresh: true
            }
          });
        });

        // 証據 seal: stamp-press entrance, then return transform to CSS (hover)
        var seal = document.querySelector(".hero-seal");
        if (seal) {
          gsap.from(seal, {
            scale: 1.4,
            opacity: 0,
            duration: 0.5,
            delay: 0.45,
            ease: "back.out(1.7)",
            clearProps: "transform,opacity"
          });
        }

        // Ledger entries rise in as they scroll into view
        gsap.utils.toArray(".ledger-entry").forEach(function (entry) {
          gsap.from(entry, {
            y: 18,
            opacity: 0,
            duration: 0.55,
            ease: "power2.out",
            clearProps: "transform,opacity",
            scrollTrigger: {
              trigger: entry,
              start: "top 90%",
              once: true
            }
          });
        });

        // Post header rule: ink line drawn from the left
        gsap.utils.toArray(".header-rule").forEach(function (rule) {
          gsap.from(rule, {
            scaleX: 0,
            transformOrigin: "left center",
            duration: 0.8,
            delay: 0.25,
            ease: "power2.inOut",
            clearProps: "transform"
          });
        });
      });

      window.addEventListener("load", function () {
        ScrollTrigger.refresh();
      });
    });
  })();
</script>
