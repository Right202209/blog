{% if site.gitalk.clientID %}
<div
    class="comments"
    data-comments-provider="gitalk"
    data-client-id="{{ site.gitalk.clientID | escape }}"
    data-client-secret="{{ site.gitalk.clientSecret | escape }}"
    data-repo="{{ site.gitalk.repo | escape }}"
    data-owner="{{ site.gitalk.owner | escape }}"
    data-title="{{ page.title | escape }}"
    data-proxy="{{ site.gitalk.proxy | escape }}">
    <div id="gitalk-container"></div>
</div>
{% endif %}
