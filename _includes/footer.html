{% assign lang = page.lang | default: site.lang | default: "zh" %}
{% assign t = site.data.i18n.languages[lang] %}

<footer class="site-footer">
  <div class="container footer-shell">
    <div class="footer-copy-block">
      <p class="footer-title">{{ site.name }}</p>
      <p class="footer-copy">{{ site.footer-text | default: site.description }}</p>
    </div>
    <div class="footer-meta">
      <p>{{ site.description }}</p>
      {% include svg-icons.html %}
      <p class="footer-copyright">© {{ site.time | date: "%Y" }} {{ site.name }}</p>
    </div>
  </div>
</footer>
