<head>
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.name | escape }} · Notes</title>
  {% include meta.html %}
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.name | escape }} · Notes" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="{{ site.favicon | relative_url }}" type="image/x-icon">
  {% if page.layout == 'post' or page.math %}
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  {% endif %}
</head>
