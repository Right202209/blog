{% if site.utteranc.repo %}
<div
  class="comments"
  data-comments-provider="utteranc"
  data-repo="{{ site.utteranc.repo | escape }}"
  data-issue-term="{{ site.utteranc.issue_term | default: 'issue-term' | escape }}"
  data-label="{{ site.utteranc.label | default: 'utteranc' | escape }}"
  data-theme="{{ site.utteranc.theme | default: 'github-dark' | escape }}"
  data-crossorigin="{{ site.utteranc.crossorigin | default: 'anonymous' | escape }}">
</div>
{% endif %}
