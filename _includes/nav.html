{% assign lang = page.lang | default: site.lang | default: "zh" %}
{% assign t = site.data.i18n.languages[lang] %}

<nav class="site-nav">
  <a class="nav-brand" href="{{ site.baseurl }}/">
    <span class="brand-seal" aria-hidden="true">札</span>
    <span class="brand-copy">
      <strong class="brand-name">{{ site.name }}</strong>
      <span class="brand-sub">{{ t.brand_sub }}</span>
    </span>
  </a>
  <div class="nav-links">
    <a href="{{ site.baseurl }}/" class="{% if page.url == '/' %}active{% endif %}">{{ t.home }}</a>
    <a href="{{ site.baseurl }}/archive" class="{% if page.url == '/archive/' %}active{% endif %}">{{ t.archive }}</a>
    <a href="{{ site.baseurl }}/tags" class="{% if page.url == '/tags/' %}active{% endif %}">{{ t.tags }}</a>
    <a href="{{ site.baseurl }}/about" class="{% if page.url == '/about/' %}active{% endif %}">{{ t.about }}</a>
  </div>
</nav>
